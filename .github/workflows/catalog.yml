# Validate the projects on every push and pull request. On main, regenerate catalog.json and commit it if it changed.
# Nothing needs to be installed locally: edit project.yaml files and push. The homepage and the blog rebuild daily.
name: Catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate and write catalog.json
        run: python scripts/build.py
      - name: Commit catalog.json
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: commit
        run: |
          if git diff --quiet -- catalog.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update catalog.json" -- catalog.json
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
