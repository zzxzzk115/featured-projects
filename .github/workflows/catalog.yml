# Validate the projects on every push and pull request. On main, regenerate catalog.json, commit it if it changed,
# then ask the sites to rebuild. Nothing needs to be installed locally: edit project.yaml files and push.
name: Catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate and write catalog.json
        run: python scripts/build.py
      - name: Commit catalog.json
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: commit
        run: |
          if git diff --quiet -- catalog.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update catalog.json" -- catalog.json
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Ask the homepage and the blog to rebuild
        # Needs a fine-grained token with "Contents: read and write" on the two site repos, saved as the repository
        # secret SITES_DISPATCH_TOKEN. Without it this step does nothing; the sites pick the catalog up on their next
        # build (the blog also rebuilds weekly).
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.SITES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "SITES_DISPATCH_TOKEN not set; skipping"; exit 0; fi
          for repo in zzxzzk115/zzxzzk115.github.io zzxzzk115/blog; do
            curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/dispatches" -d '{"event_type":"featured-projects-updated"}'
            echo "dispatched $repo"
          done
