overview:
  en:
    purpose: Configure MCHOSE mouse hardware and desktop presets from Linux.
    contribution: I extended Alexandre Frih’s mchose-linux with a GUI, CLI, per-application presets and KDE desktop integration,
      retaining its HID protocol implementation.
    outcome: The tool includes tray operation, automatic preset switching and Chinese/English interfaces. It is an independent
      project.
  zh:
    purpose: 在 Linux 上设置 MCHOSE 鼠标的硬件参数和桌面预设。
    contribution: 我在 Alexandre Frih 的 mchose-linux 基础上加了 GUI、CLI、按应用切换的预设和 KDE 桌面集成，保留了它的 HID 协议实现。
    outcome: 工具支持托盘运行和自动切换预设，有中英文界面。这是一个独立项目。
