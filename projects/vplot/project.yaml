overview:
  en:
    purpose: Export figures and embed plots in C++ applications without requiring a Python runtime.
    contribution: I adapt Matplotlib’s C++ rendering core into a standalone C++23 library, with a C ABI, figure export and
      Dear ImGui integration.
    outcome: A WebAssembly demo is available, with PNG, SVG and PDF output. The API is still evolving and plotting coverage
      varies by method.
  zh:
    purpose: 不依赖 Python 运行时，也能在 C++ 程序里导出图表、嵌入绘图。
    contribution: 我把 Matplotlib 的 C++ 渲染核心改造成独立的 C++23 库，提供 C ABI、图表导出和 Dear ImGui 集成。
    outcome: 已经有 WebAssembly 演示，支持输出 PNG、SVG 和 PDF。API 还在变，不同绘图方法的完成度也不一样。
